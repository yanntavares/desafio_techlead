services:
  db:
    image: postgres:15-alpine
    container_name: booking_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private_network
    
  backend:
    build: 
      context: ./desafio_techlead_back
      dockerfile: Dockerfile
    container_name: desafio_techlead_back
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
    networks:
      - public_network
      - private_network

  frontend:
    build:
      context: ./desafio_techlead_front
      dockerfile: Dockerfile
    container_name: desagio_techlead_front
    ports:
      - "3001:3001"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    networks:
      - public_network

networks:
  public_network:
    driver: bridge
  private_network:
    driver: bridge

volumes:
  postgres_data: